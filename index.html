<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인표 정책 · 인표</title>
<style>
:root {
  --bg: #0B0F1E;        /* abyssNavy  */
  --surface: #161D33;   /* floorIndigo */
  --rule: #273455;      /* wallSlate  */
  --ink: #F4F7FF;       /* paperWhite */
  --sub: #A9B4D0;
  --muted: #7C88A8;
  --accent: #2EE6C8;    /* signalMint */
  --ember: #FFC93C;     /* emberYellow */
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
    "Hiragino Sans", "Yu Gothic", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.8;
  padding: 24px 18px 64px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
main { max-width: 760px; margin: 0 auto; }
h1 {
  font-size: 1.55rem; line-height: 1.35; letter-spacing: -0.01em;
  margin: 8px 0 20px; color: var(--ink);
}
h2 {
  font-size: 1.1rem; line-height: 1.5; margin: 40px 0 12px;
  padding-left: 12px; border-left: 3px solid var(--accent);
}
h3 { font-size: 1rem; margin: 26px 0 8px; color: var(--accent); }
p { margin: 0 0 14px; color: var(--sub); }
strong { color: var(--ink); font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover, a:focus { text-decoration: underline; }
ul, ol { margin: 0 0 16px; padding-left: 22px; color: var(--sub); }
li { margin-bottom: 8px; }
li > ul, li > ol { margin: 8px 0 0; }
hr { border: none; border-top: 1px solid var(--rule); margin: 32px 0; }
code {
  background: var(--surface); color: var(--ember);
  padding: 1px 6px; border-radius: 5px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
}
.tw { overflow-x: auto; margin: 0 0 20px; -webkit-overflow-scrolling: touch; }
table {
  border-collapse: collapse; width: 100%; min-width: 460px;
  font-size: 0.9rem; background: var(--surface); border-radius: 10px;
}
th, td { border: 1px solid var(--rule); padding: 9px 12px; text-align: left; vertical-align: top; }
th { background: rgba(46, 230, 200, 0.1); color: var(--ink); font-weight: 600; white-space: nowrap; }
td { color: var(--sub); }
.meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 4px; }
.langbar {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 0 0 28px; padding-bottom: 18px; border-bottom: 1px solid var(--rule);
}
.langbar a, .langbar span {
  font-size: 0.85rem; padding: 5px 13px; border-radius: 999px;
  border: 1px solid var(--rule); color: var(--sub);
}
.langbar .on { border-color: var(--accent); color: var(--accent); }
.cards { list-style: none; padding: 0; margin: 8px 0 0; }
.cards li { margin: 0 0 12px; }
.cards a {
  display: block; padding: 16px 18px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--rule);
}
.cards a:hover { border-color: var(--accent); text-decoration: none; }
.cards .t { color: var(--ink); font-weight: 600; }
.cards .d { color: var(--muted); font-size: 0.85rem; }
footer {
  margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule);
  text-align: center; color: var(--muted); font-size: 0.8rem; line-height: 2;
}
@media (max-width: 480px) {
  body { font-size: 15px; padding: 20px 14px 56px; }
  h1 { font-size: 1.35rem; }
}
</style>

</head>
<body>
<main>
<h1>인표</h1>
<p class="meta">Hasegi Inc. · com.hasegi.inpyo</p>
<p>인표는 한국 재테크 커뮤니티에서 어떤 이야기가 얼마나 오가는지를 매일 집계해 보여주는 관측 앱입니다. 아래에서 정책 문서를 확인하실 수 있습니다.</p>
<ul>
  <li><a href="./privacy/">개인정보 처리방침</a></li>
  <li><a href="./terms/">이용약관</a></li>
</ul>
<p>앱이 제공하는 내용은 투자 자문이나 매매 신호가 아니며, 지표의 예측력은 아직 검증되지 않았습니다. 자세한 내용은 이용약관 제6조를 참고해 주십시오.</p>
<footer>
  <p>Hasegi Inc. · 개발팀 · 문의 <a href="mailto:hasegi.cs@gmail.com">hasegi.cs@gmail.com</a></p>
</footer>
</main>
</body>
</html>
